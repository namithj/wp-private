name: Release

# Runs when a version tag is pushed. Builds the ZIP, asserts on its contents and
# attaches it to a GitHub release. WordPress.org is published by the separate
# "Deploy to WordPress.org" workflow, run by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, for example v2.0.0'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version check
    uses: ./.github/workflows/version-sync.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  build:
    name: Build and publish release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer, wp-cli
          coverage: none

      - name: Verify "Tested up to" covers the current WordPress release
        run: bash bin/check-tested-up-to.sh

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Verify coding standards and static analysis
        run: |
          composer lint:release
          composer analyse

      - name: Verify the .pot extracts
        run: bash bin/make-pot.sh .cache/wp-private.pot

      - name: Build release ZIP
        shell: bash
        run: |
          bash bin/build-release.sh "${RUNNER_TEMP}/dist"
          ZIP="$( ls "${RUNNER_TEMP}"/dist/wp-private-*.zip )"
          bash bin/check-release-zip.sh "${ZIP}"
          ( cd "$( dirname "${ZIP}" )" && sha256sum "$( basename "${ZIP}" )" | tee "$( basename "${ZIP}" ).sha256" )
          echo "ZIP_PATH=${ZIP}" >> "${GITHUB_ENV}"

      - name: Build Playground bundle
        shell: bash
        run: |
          BUNDLE_PATH="${ZIP_PATH%.zip}-playground.zip"
          bash bin/build-playground-bundle.sh "${ZIP_PATH}" "${BUNDLE_PATH}"
          echo "BUNDLE_PATH=${BUNDLE_PATH}" >> "${GITHUB_ENV}"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sha256
            ${{ env.BUNDLE_PATH }}
          generate_release_notes: true

      # The demo installs the ZIP attached to this very release.
      - name: Generate release Playground URL
        shell: bash
        run: |
          PLAYGROUND_URL="$(node -e '
            const blueprint = JSON.parse( require( "fs" ).readFileSync( ".wordpress-org/blueprints/blueprint.json", "utf8" ) );
            const [ repository, tag, zipName ] = process.argv.slice( 1 );
            for ( const step of blueprint.steps ) {
              if ( step.step === "installPlugin" ) {
                step.pluginData = { resource: "url", url: "https://github.com/" + repository + "/releases/download/" + tag + "/" + zipName };
              }
            }
            process.stdout.write( "https://playground.wordpress.net/#" + Buffer.from( JSON.stringify( blueprint ) ).toString( "base64" ) );
          ' "${GITHUB_REPOSITORY}" "${TAG}" "$( basename "${ZIP_PATH}" )")"
          echo "PLAYGROUND_URL=${PLAYGROUND_URL}" >> "${GITHUB_ENV}"

      - name: Add Playground link to release description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const startMarker = '<!-- wp-private-playground:start -->';
            const endMarker = '<!-- wp-private-playground:end -->';
            const section = [
              startMarker,
              '## Live demo',
              '',
              `[Try this release in WordPress Playground](${process.env.PLAYGROUND_URL})`,
              endMarker,
            ].join('\n');
            const markerPattern = new RegExp(
              `\\n?${startMarker}[\\s\\S]*?${endMarker}\\n?`,
              'g',
            );
            const { owner, repo } = context.repo;
            const release = (
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: process.env.TAG,
              })
            ).data;
            // Regenerated notes are preserved; only the marked section is replaced.
            const preservedBody = (release.body || '').replace(markerPattern, '').trimEnd();
            const body = preservedBody ? `${preservedBody}\n\n${section}` : section;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: Number(release.id),
              body,
            });

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Release ${TAG}"
            echo
            echo "- SHA-256: \`$(cut -d' ' -f1 "${ZIP_PATH}.sha256")\`"
            echo "- [Try it in WordPress Playground](${PLAYGROUND_URL})"
            echo
            echo "WordPress.org is not published automatically. To ship this"
            echo "release there, run the **Deploy to WordPress.org** workflow by hand."
          } >> "${GITHUB_STEP_SUMMARY}"
